# PatchCore 配置文件
# 用法: python run.py --config configs/patchcore_config.yaml

# 数据集
dataset:
  root: "C:/Users/1/Desktop/素材/mvtec_anomaly_detection"   # MVTec AD 根目录（已从 Desktop 移到 素材）
  categories: ["toothbrush", "pill"]                    # 要跑的类别
  image_size: 448                                      # 输入尺寸（224->448，提升小缺陷分辨率）
  # ImageNet 归一化（backbone 预训练时使用的统计量）
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

# PatchCore 模型
model:
  backbone: "wide_resnet50_2"   # 可选: wide_resnet50_2 / resnet50
  layers: ["layer2", "layer3"]  # 取哪些层的特征（PatchCore 原论文配置）
  coreset_ratio: 0.1             # coreset 稀疏采样比例（10%）
  replace: false                 # coreset 采样是否放回
  anomaly_dir: "max"             # 图像级分数聚合: avg / max（toothbrush 用 max 更稳）
  n_neighbors: 3                 # 最近邻个数（PatchCore 用 3）

# 按类别覆盖上面的 model 段（不同类别的最优超参可能不同；未列出的类别用默认值）
# pill 调参实验（test 集 167 张）：
#   k=3  -> pixel 0.9616 / AUPRO 0.9625
#   k=5  -> pixel 0.9673 / AUPRO 0.9671
#   k=9  -> pixel 0.9732 / AUPRO 0.9714  ← 选它（官方 PatchCore 默认 k=9）
#   k=15 -> pixel 0.9752 / AUPRO 0.9735（图像级 AUROC 降到 0.9735，不值得）
# toothbrush 在 k=9 下 AUPRO 略降，故保持全局 k=3。
model_overrides:
  pill:
    n_neighbors: 9

# 训练（构建 memory bank）
train:
  batch_size: 4
  num_workers: 4
  device: "cuda"                # cuda / cpu
  seed: 42

# 输出
output:
  dir: "outputs"
  save_heatmap: true             # 是否保存缺陷热力图
  heatmap_num: 8                 # 每个类别保存多少张热力图样本
